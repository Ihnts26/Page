  <style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1f2933, #0b1120);
    color: #f9fafb;
  }

  .container {
    max-width: 600px;
    text-align: center;
    padding: 2.5rem 1.5rem;
    border-radius: 1rem;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(148, 163, 184, 0.4);
    animation: pulseGlow 2.2s ease-in-out infinite;
  }

  @keyframes pulseGlow {
    0%, 100% {
      box-shadow: 0 0 12px rgba(148, 163, 184, 0.4);
    }
    50% {
      box-shadow: 0 0 28px rgba(148, 163, 184, 0.7);
    }
  }

  .logo {
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: 0.85rem;
    color: #9ca3af;
    margin-bottom: 1.5rem;
  }

  h1 {
    font-size: 2.2rem;
    margin-bottom: 0.75rem;
    animation: blinkSoft 1.8s ease-in-out infinite;
  }

  @keyframes blinkSoft {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .subtitle {
    font-size: 1rem;
    color: #d1d5db;
    margin-bottom: 1.75rem;
    animation: hardBlink 1s step-start infinite;
  }

  @keyframes hardBlink {
    50% { opacity: 0; }
  }

  .footer {
    margin-top: 1.5rem;
    font-size: 0.8rem;
    color: #6b7280;
  }

  @media (max-width: 480px) {
    h1 {
      font-size: 1.8rem;
    }
    .container {
      padding: 2rem 1.25rem;
    }
  }
